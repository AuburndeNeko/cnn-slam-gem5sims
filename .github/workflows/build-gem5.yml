# .github/workflows/build-gem5.yml
# Builds gem5 v25.1.0.0 (ARM ISA, Ruby + CHI) once on a native ARM64 Linux runner
# and publishes gem5.opt as a GitHub Release asset, so later jobs just download it.
name: Build gem5 (ARM, Ruby CHI)

on:
  workflow_dispatch:   # run manually from the Actions tab

permissions:
  contents: write      # needed to create the release

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git m4 scons zlib1g-dev \
            libprotobuf-dev protobuf-compiler libprotoc-dev \
            libgoogle-perftools-dev python3-dev pkg-config \
            libpng-dev libhdf5-serial-dev libelf-dev

      - name: Clone gem5 v25.1.0.0
        run: git clone --depth 1 --branch v25.1.0.0 https://github.com/gem5/gem5.git

      - name: Configure (ARM, Ruby, CHI) and verify
        working-directory: gem5
        run: |
          scons defconfig build/ARM build_opts/ARM
          echo "---- Ruby / protocol settings ----"
          grep -E "^(CONFIG_)?RUBY" build/ARM/gem5.build/config
          grep -qE "^(CONFIG_)?RUBY_PROTOCOL_CHI=y" build/ARM/gem5.build/config \
            || { echo "CHI protocol not enabled, stopping"; exit 1; }

      - name: Build gem5.opt
        working-directory: gem5
        run: scons build/ARM/gem5.opt -j$(nproc)

      - name: Smoke test
        working-directory: gem5
        run: |
          ./build/ARM/gem5.opt --help > /tmp/gem5_help.txt
          head -n 5 /tmp/gem5_help.txt

      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf gem5-arm64-chi.tar.gz -C gem5/build/ARM gem5.opt
          gh release create gem5-v25.1-arm64 gem5-arm64-chi.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "gem5 v25.1.0.0 ARM (Ruby CHI), linux-arm64" \
            --notes "Built by build-gem5.yml"
