# .github/workflows/sims-round4.yml
# Round 4: accelerator proxy + non-matmul benchmark.
#  - audio_4cpu_mesh:          baseline (main + 2 vision + audio), same as round 3
#  - audio_5cpu_mesh_accel46:  + accelerator proxy thread on cpu4 / router 3, busy 46%
#                              of each 1 ms period (wearable design point, OS / 2 MB)
#  - audio_5cpu_mesh_accel100: + proxy busy 100% (upper end of the intensity range)
#  - nonmatmul (separate job): softmax / LayerNorm / GELU cost on one MinorCPU
# All mesh jobs use gem5_accel/2x4_accel.py (cpus 0-3 on routers 1,2,5,6 as in
# 2x4.py; cpu4 on router 3), so the baseline layout is unchanged.
name: gem5 sims round 4 (accelerator proxy)

on:
  workflow_dispatch:
    inputs:
      frames:
        description: "Frames to simulate (KIMG file has 10)"
        default: "10"
      ds:
        description: "Image downsample factor (2 = 621x187)"
        default: "2"
      audio:
        description: "KAUD clip (path in repo)"
        default: "data/audio_0005.kaud"

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: audio_4cpu_mesh            # baseline
            cpus: 4
            vision: 2
            accel: 0
          - name: audio_5cpu_mesh_accel46    # + proxy, wearable duty cycle
            cpus: 5
            vision: 2
            accel: 46
          - name: audio_5cpu_mesh_accel100   # + proxy, always busy
            cpus: 5
            vision: 2
            accel: 100
    steps:
      - uses: actions/checkout@v4

      - name: Install gem5 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libprotobuf-dev libgoogle-perftools-dev \
            python3-dev libpng-dev libhdf5-serial-dev zlib1g-dev python3-pydot graphviz

      - name: Get gem5 configs (v25.1.0.0) and prebuilt gem5.opt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch v25.1.0.0 https://github.com/gem5/gem5.git
          gh release download gem5-v25.1-x86-host -p 'gem5-x86host-chi.tar.gz' \
            --repo "$GITHUB_REPOSITORY"
          mkdir -p gem5/build/ARM
          tar xzf gem5-x86host-chi.tar.gz -C gem5/build/ARM
          cp gem5_accel/2x4_accel.py gem5/configs/example/noc_config/

      - name: Build project ARM binaries (Makefile, Docker Ubuntu 20.04)
        run: make slam_mc_arm64

      - name: Run simulation
        working-directory: gem5
        run: |
          P=$GITHUB_WORKSPACE
          OUT=m5out/${{ matrix.name }}
          mkdir -p "$OUT"
          TOPO="--topology=CustomMesh --chi-config=configs/example/noc_config/2x4_accel.py"
          AUD="--audio $P/${{ inputs.audio }}"
          ACC=""
          if [ "${{ matrix.accel }}" != "0" ]; then
            ACC="--accel-duty ${{ matrix.accel }} --accel-period-us 1000"
          fi
          echo "cpus=${{ matrix.cpus }} vision_threads=${{ matrix.vision }} accel_duty=${{ matrix.accel }}" \
            | tee "$OUT/run_info.txt"
          set +e
          timeout 345m ./build/ARM/gem5.opt -re -d "$OUT" configs/deprecated/example/se.py \
            --cpu-type=ArmMinorCPU --num-cpus=${{ matrix.cpus }} \
            --ruby --network=garnet $TOPO --maxtime=0.5 \
            --cmd=$P/slam_mc_arm64 \
            --options="--data $P/data/2011_09_26_drive_0005.bin --images $P/data/2011_09_26_drive_0005_img10.bin --threads ${{ matrix.vision }} --frames ${{ inputs.frames }} --ds ${{ inputs.ds }} $AUD $ACC --verbose"
          CODE=$?
          echo "gem5 exit code: $CODE  (0 = finished, 124 = hit the wall-clock limit)" \
            | tee "$OUT/exit_code.txt"

      - name: Summary
        if: always()
        working-directory: gem5
        run: |
          OUT=m5out/${{ matrix.name }}
          cat "$OUT/run_info.txt" "$OUT/exit_code.txt" 2>/dev/null || true
          echo "==== program output (results only) ===="
          grep -vE "^\[(m|a|w[0-9]+)\]" "$OUT/simout.txt" 2>/dev/null | tail -n 45 || true
          echo "==== gem5 stderr (last 10 lines) ===="
          tail -n 10 "$OUT/simerr.txt" 2>/dev/null || true
          echo "==== key stats ===="
          grep -E "simTicks|simInsts|hostSeconds|numCycles|\.ipc |packets_received::total|average_packet_latency|average_hops|average_packet_queueing_latency|average_packet_network_latency" \
            "$OUT/stats.txt" 2>/dev/null | grep -v commitStats | head -n 60 || true

      - name: Upload m5out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5out-${{ matrix.name }}
          path: gem5/m5out/${{ matrix.name }}

  nonmatmul:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install gem5 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libprotobuf-dev libgoogle-perftools-dev \
            python3-dev libpng-dev libhdf5-serial-dev zlib1g-dev

      - name: Get gem5 configs (v25.1.0.0) and prebuilt gem5.opt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch v25.1.0.0 https://github.com/gem5/gem5.git
          gh release download gem5-v25.1-x86-host -p 'gem5-x86host-chi.tar.gz' \
            --repo "$GITHUB_REPOSITORY"
          mkdir -p gem5/build/ARM
          tar xzf gem5-x86host-chi.tar.gz -C gem5/build/ARM

      - name: Build benchmark (Makefile, Docker Ubuntu 20.04)
        run: make nonmatmul_arm64

      - name: Run benchmark (1 MinorCPU, 2 GHz, Ruby mesh like the SLAM runs)
        working-directory: gem5
        run: |
          OUT=m5out/nonmatmul
          mkdir -p "$OUT"
          set +e
          timeout 110m ./build/ARM/gem5.opt -re -d "$OUT" configs/deprecated/example/se.py \
            --cpu-type=ArmMinorCPU --num-cpus=1 \
            --ruby --network=garnet --topology=CustomMesh \
            --chi-config=configs/example/noc_config/2x4.py \
            --cmd=$GITHUB_WORKSPACE/nonmatmul_arm64
          echo "gem5 exit code: $?" | tee "$OUT/exit_code.txt"

      - name: Summary
        if: always()
        working-directory: gem5
        run: |
          cat m5out/nonmatmul/exit_code.txt 2>/dev/null || true
          grep "\[bench\]" m5out/nonmatmul/simout.txt 2>/dev/null || true
          tail -n 10 m5out/nonmatmul/simerr.txt 2>/dev/null || true

      - name: Upload m5out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5out-nonmatmul
          path: gem5/m5out/nonmatmul
