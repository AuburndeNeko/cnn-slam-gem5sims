# .github/workflows/build-gem5-arm.yml
# Builds gem5 v25.1.0.0 (ARM ISA, Ruby + CHI) on a native ARM64 Linux runner.
# KVM is switched off: gem5 25.1's ARM KVM code fails to compile on arm64 hosts,
# and KVM is not usable on GitHub runners anyway.
name: Build gem5 on ARM host (ARM, Ruby CHI, no KVM)

on:
  workflow_dispatch:   # run manually from the Actions tab

permissions:
  contents: write      # needed to create the release

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git m4 scons zlib1g-dev \
            libprotobuf-dev protobuf-compiler libprotoc-dev \
            libgoogle-perftools-dev python3-dev pkg-config \
            libpng-dev libhdf5-serial-dev libelf-dev

      - name: Clone gem5 v25.1.0.0
        run: git clone --depth 1 --branch v25.1.0.0 https://github.com/gem5/gem5.git

      - name: Configure (ARM, Ruby, CHI, KVM off) and verify
        working-directory: gem5
        run: |
          CFG=build/ARM/gem5.build/config
          scons defconfig build/ARM build_opts/ARM
          scons setconfig build/ARM USE_KVM=n
          echo "---- Ruby / protocol / KVM settings ----"
          grep -E "RUBY|KVM" "$CFG" || true
          grep -qE "^(CONFIG_)?RUBY_PROTOCOL_CHI=y" "$CFG" \
            || { echo "CHI protocol not enabled, stopping"; exit 1; }
          if grep -qE "^(CONFIG_)?USE_KVM=y" "$CFG"; then
            echo "KVM is still enabled, stopping before the long build"; exit 1
          fi

      - name: Build gem5.opt
        working-directory: gem5
        run: scons build/ARM/gem5.opt -j$(nproc)

      - name: Smoke test
        working-directory: gem5
        run: |
          ./build/ARM/gem5.opt --help > /tmp/gem5_help.txt
          head -n 5 /tmp/gem5_help.txt

      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp gem5/LICENSE gem5/build/ARM/LICENSE-gem5
          tar czf gem5-armhost-chi.tar.gz -C gem5/build/ARM gem5.opt LICENSE-gem5
          gh release create gem5-v25.1-arm64-host gem5-armhost-chi.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "gem5 v25.1.0.0 ARM (Ruby CHI, no KVM), linux-arm64 host" \
            --notes "Built by build-gem5-arm.yml"
